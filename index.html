<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PULSE / FIRE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #0d0d0d;
            --card: #181818;
            --accent: #b24bf3; 
            --accent-glow: rgba(178, 75, 243, 0.4);
            --text: #eeeeee;
            --danger: #ff4d4d;
            --success: #00ff88;
        }

        .fire-mode {
            --accent: #ff3300;
            --accent-glow: rgba(255, 51, 0, 0.4);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; padding: 0; width: 100%; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 12px 0; transition: background 0.3s; }
        :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        button { touch-action: manipulation; }

        #rotate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999; display: none;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        @media (orientation: landscape) and (max-height: 500px) { #rotate-overlay { display: flex; } }

        .container {
            width: 92%; max-width: 380px; background: var(--card); padding: 20px;
            border-radius: 28px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            border: 1px solid #2a2a2a; position: relative;
        }

        /* Toggle Simmetrico */
        .mode-selector {
            display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 15px;
            font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 900; letter-spacing: 1px;
        }
        .mode-label { transition: 0.3s; color: #444; }
        .mode-label.active-pulse { color: #b24bf3; text-shadow: 0 0 8px rgba(178, 75, 243, 0.5); }
        .mode-label.active-fire { color: #ff3300; text-shadow: 0 0 8px rgba(255, 51, 0, 0.5); }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
        input:focus-visible + .slider { outline: 2px solid var(--text); outline-offset: 3px; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222; transition: .4s; border-radius: 34px; border: 1px solid #333;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: #444; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { border-color: #ff3300; }
        input:checked + .slider:before { transform: translateX(22px); background-color: #ff3300; box-shadow: 0 0 10px #ff3300; }

        h1 { 
            color: var(--accent); margin: 0; font-size: 1.8rem; text-transform: uppercase;
            font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow); transition: 0.3s;
        }

        .map-trigger {
            background: #222; border: 1px solid #444; color: var(--text);
            padding: 5px 12px; border-radius: 8px; font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem; cursor: pointer;
        }

        .progress-container { margin: 15px 0; background: #222; height: 4px; border-radius: 10px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.5s ease; }


        #day-select {
            width: 100%; padding: 12px; background: #222 !important; color: white !important;
            border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 15px;
            font-size: 16px; font-family: 'Inter', sans-serif;
        }

        /* Griglia dinamica */
        .grid { display: grid; gap: 10px; margin-bottom: 15px; }
        .grid-pulse { grid-template-columns: 1fr 1fr; }
        .grid-fire { grid-template-columns: 1fr 1fr 1fr; }
        
        .speed-btn {
            background: #252525; border: 1px solid #333; color: white;
            padding: 15px 2px; border-radius: 12px; font-size: 1.1rem;
            font-weight: bold; font-family: 'Orbitron', sans-serif;
        }
        .speed-btn:active { background: var(--accent); color: #000; }
        
        .display {
            background: #000; padding: 15px; border-radius: 20px;
            margin-bottom: 15px; border: 1px solid #222; transition: 0.05s;
        }
        .display.flash { background-color: var(--accent); }
        #bpm-val { font-size: 4rem; font-weight: 900; color: var(--accent); font-family: 'Orbitron', sans-serif; line-height: 1; }

        .multipliers { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 15px; }
        .mult-btn { flex: 1; background: #222; border: 1px solid #333; color: white; padding: 10px 0; border-radius: 8px; font-size: 0.6rem; font-weight: bold; }
        .mult-btn.active, .speed-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .mult-btn:disabled { opacity: 0.25; }

        .action-row { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 15px 5px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 0.65rem; text-transform: uppercase; cursor: pointer; border: none; }
        .complete-btn { background: #1a1a1a; border: 1px solid var(--success) !important; color: var(--success); }
        .complete-btn.done { background: var(--success); color: #000; }
        .stop-btn { background: var(--danger); color: white; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { width: 90%; max-width: 350px; background: #111; padding: 25px; border-radius: 24px; border: 1px solid var(--accent); }
        .progress-map { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 20px; }
        .map-dot { aspect-ratio: 1; background: #222; border-radius: 4px; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; color: #444; font-weight: bold; }
        .map-dot.completed { background: var(--accent); color: white; box-shadow: 0 0 8px var(--accent); }
        .close-modal { margin-top: 25px; width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: white; font-family: 'Orbitron', sans-serif; font-weight: bold; }
    </style>
</head>
<body>

<div id="rotate-overlay">
    <div style="font-family: 'Orbitron'; color: var(--accent);">
        <p style="font-size: 1.5rem;">PLEASE ROTATE</p>
        <p style="font-size: 0.8rem; color: #888;">OPTIMIZED FOR VERTICAL USE</p>
    </div>
</div>

<div class="container">
    <div class="mode-selector">
        <span id="label-pulse" class="mode-label active-pulse">PULSE</span>
        <label class="switch">
            <input type="checkbox" id="mode-toggle" onchange="switchMode()">
            <span class="slider"></span>
        </label>
        <span id="label-fire" class="mode-label">FIRE</span>
    </div>

    <div class="header">
        <h1 id="app-title">PULSE 28</h1>
        <button class="map-trigger" onclick="toggleModal(true)">MAP</button>
    </div>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    
    <select id="day-select" aria-label="Training day" onchange="loadSpeeds()"></select>

    <div id="speed-container" class="grid grid-pulse"></div>

    <div class="display" id="bpm-display">
        <div id="bpm-val">0</div>
    </div>

    <div class="multipliers">
        <button class="mult-btn" onclick="applyMult(0.25)">x0.25</button>
        <button class="mult-btn" onclick="applyMult(0.5)">x0.50</button>
        <button class="mult-btn" onclick="applyMult(1)">x1</button>
        <button class="mult-btn" onclick="applyMult(2)">x2</button>
        <button class="mult-btn" onclick="applyMult(4)">x4</button>
    </div>

    <div class="action-row">
        <button class="action-btn stop-btn" onclick="stopMet()">STOP</button>
        <button id="complete-btn" class="action-btn complete-btn" onclick="toggleDayComplete()">MISSION ACCOMPLISHED</button>
    </div>
</div>

<div class="modal" id="map-modal" role="dialog" aria-modal="true" aria-label="Progress map" onclick="if(event.target===this)toggleModal(false)">
    <div class="modal-content">
        <h2 style="font-family: 'Orbitron'; color: var(--accent); margin: 0; font-size: 1.2rem; text-align: center;">PROGRESS MAP</h2>
        <div class="progress-map" id="progress-map"></div>
        <button class="close-modal" onclick="toggleModal(false)">CLOSE</button>
    </div>
</div>

<script>
    const chart28 = {
        1:[50,58,69,84], 2:[52,60,72,88], 3:[54,63,76,92], 4:[56,66,80,96],
        5:[60,72,88,104], 6:[63,76,92,108], 7:[66,80,96,112], 8:[69,84,100,116],
        9:[40,48,56,66], 10:[42,50,58,69], 11:[44,52,60,72], 12:[46,54,63,76],
        13:[72,88,104,120], 14:[76,92,108,126], 15:[80,96,112,132], 16:[84,100,116,138],
        17:[108,126,152,184], 18:[112,132,160,192], 19:[116,138,168,200], 20:[120,144,176,208],
        21:[96,112,132,160], 22:[100,116,138,168], 23:[104,120,144,176], 24:[108,126,152,184],
        25:[84,100,116,138], 26:[88,104,120,144], 27:[92,108,126,152], 28:[96,112,132,160]
    };

    const chartFire = {
        1:[50,60,70,80,90,100], 2:[65,75,85,100,115,125], 3:[40,50,60,70,80,90],
        4:[75,90,105,120,135,145], 5:[110,130,150,170,190,210], 6:[100,120,140,160,180,195],
        7:[90,110,130,150,170,185]
    };

    const MIN_BPM = 20, MAX_BPM = 300, MULTS = [0.25, 0.5, 1, 2, 4];
    const $ = id => document.getElementById(id);

    // localStorage "sicuro": non rompe l'app in navigazione privata o con dati corrotti
    const ls = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignora */ } }
    };
    const readObj = k => { try { return JSON.parse(ls.get(k) || '{}') || {}; } catch (e) { return {}; } };

    let isFireMode = false, baseBpm = 0, curMult = 1, curBpm = 0;
    let audioCtx = null, timerID = null, nextTickTime = 0, lastTick = 0, isPlaying = false;
    let keepAlive = null, wakeLock = null;
    let completed28 = readObj('pulseProgress');
    let completedFire = readObj('fireProgress');

    function initApp() {
        if (ls.get('pulseMode') === 'fire') { isFireMode = true; $('mode-toggle').checked = true; }
        updateVisualMode(); setupDaySelect(); loadSpeeds();
        document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleModal(false); });
    }

    function switchMode() {
        isFireMode = $('mode-toggle').checked;
        ls.set('pulseMode', isFireMode ? 'fire' : '28');
        stopMet(); baseBpm = 0;
        updateVisualMode(); setupDaySelect(); loadSpeeds();
    }

    function updateVisualMode() {
        document.body.classList.toggle('fire-mode', isFireMode);
        $('label-pulse').classList.toggle('active-pulse', !isFireMode);
        $('label-fire').classList.toggle('active-fire', isFireMode);
        $('app-title').innerText = isFireMode ? 'FIRE 7' : 'PULSE 28';
    }

    // Apre direttamente il primo giorno non ancora completato
    function nextIncompleteDay() {
        const limit = isFireMode ? 7 : 28, st = isFireMode ? completedFire : completed28;
        for (let i = 1; i <= limit; i++) if (!st[i]) return i;
        return 1;
    }

    function setupDaySelect(selected) {
        const select = $('day-select');
        select.innerHTML = '';
        const limit = isFireMode ? 7 : 28;
        const storage = isFireMode ? completedFire : completed28;
        const prefix = isFireMode ? 'FIRE DAY' : 'DAY';
        for (let i = 1; i <= limit; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${prefix} ${i}` + (storage[i] ? ' ✓' : '');
            select.appendChild(opt);
        }
        select.value = selected || nextIncompleteDay();
    }

    function loadSpeeds() {
        const speeds = (isFireMode ? chartFire : chart28)[$('day-select').value] || [];
        const container = $('speed-container');
        container.innerHTML = '';
        container.className = isFireMode ? 'grid grid-fire' : 'grid grid-pulse';
        speeds.forEach(s => {
            const b = document.createElement('button');
            b.className = 'speed-btn';
            b.innerText = s;
            b.setAttribute('aria-label', s + ' BPM');
            b.onclick = () => { baseBpm = s; curMult = 1; startMet(s); };
            container.appendChild(b);
        });
        updateUI(); markActive();
    }

    function markActive() {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', isPlaying && +b.textContent === baseBpm));
        document.querySelectorAll('.mult-btn').forEach((b, i) => {
            const r = baseBpm * MULTS[i];
            b.classList.toggle('active', isPlaying && curMult === MULTS[i]);
            b.disabled = baseBpm > 0 && (r < MIN_BPM || r > MAX_BPM);   // es. x4 di 208 = 832 BPM: non suonabile
        });
    }

    function updateUI() {
        const day = $('day-select').value;
        const storage = isFireMode ? completedFire : completed28;
        const completeBtn = $('complete-btn');
        const limit = isFireMode ? 7 : 28;

        if (storage[day]) { completeBtn.innerText = 'DONE ✓'; completeBtn.classList.add('done'); }
        else { completeBtn.innerText = 'MISSION ACCOMPLISHED'; completeBtn.classList.remove('done'); }

        $('progress-bar').style.width = (Object.keys(storage).length / limit * 100) + '%';

        const map = $('progress-map');
        map.innerHTML = '';
        for (let i = 1; i <= limit; i++) {
            const dot = document.createElement('div');
            dot.className = 'map-dot' + (storage[i] ? ' completed' : '');
            dot.innerText = i;
            map.appendChild(dot);
        }
    }

    function toggleDayComplete() {
        const day = $('day-select').value;
        const storage = isFireMode ? completedFire : completed28;
        if (storage[day]) delete storage[day]; else storage[day] = true;
        ls.set(isFireMode ? 'fireProgress' : 'pulseProgress', JSON.stringify(storage));
        setupDaySelect(day);
        updateUI();
    }

    function toggleModal(show) { $('map-modal').classList.toggle('active', show); }

    /* ---------- Audio ---------- */
    function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Fruscio quasi inudibile: tiene aperto il canale dei ricevitori Bluetooth tra un click e l'altro
    const KEEPALIVE_GAIN = 0.004;
    function startKeepAlive() {
        if (keepAlive) return;
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate), ch = buf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
        src.buffer = buf; src.loop = true; g.gain.value = KEEPALIVE_GAIN;
        src.connect(g); g.connect(audioCtx.destination); src.start();
        keepAlive = { src, g };
    }
    function stopKeepAlive() {
        if (!keepAlive) return;
        try { keepAlive.src.stop(); } catch (e) { /* già fermo */ }
        keepAlive.g.disconnect(); keepAlive = null;
    }

    async function setWake(on) {
        try {
            if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        } catch (e) { /* non critico */ }
    }

    function clickAt(t) {
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.frequency.setValueAtTime(1500, t);               // 1500 Hz: passa meglio il noise-gate Bluetooth
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.9, t + 0.003);      // attacco morbido, niente distorsione a gain 1.0
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.1);
        setTimeout(() => {
            const d = $('bpm-display'); d.classList.add('flash');
            setTimeout(() => d.classList.remove('flash'), 50);
        }, Math.max(0, (t - audioCtx.currentTime) * 1000));
    }

    // Scheduler con lookahead sul clock audio: niente jitter né deriva come con setInterval
    function scheduler() {
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            clickAt(nextTickTime); lastTick = nextTickTime;
            nextTickTime += 60 / curBpm;
        }
        timerID = setTimeout(scheduler, 25);
    }

    function startMet(bpm) {
        bpm = Math.round(bpm);
        if (bpm < MIN_BPM || bpm > MAX_BPM) return;
        unlockAudio(); curBpm = bpm; $('bpm-val').innerText = bpm;
        if (!isPlaying) {
            isPlaying = true; startKeepAlive(); setWake(true);
            nextTickTime = audioCtx.currentTime + 0.3;       // tempo al link BT per "svegliarsi"
            scheduler();
        } else {
            const now = audioCtx.currentTime;                // cambio tempo senza doppi click
            nextTickTime = Math.min(Math.max(now + 0.02, lastTick + 60 / bpm), now + 0.5);
        }
        markActive();
    }

    function stopMet() {
        isPlaying = false; clearTimeout(timerID); stopKeepAlive(); setWake(false);
        curBpm = 0; $('bpm-val').innerText = '0'; markActive();
    }

    function applyMult(m) {
        if (baseBpm <= 0) return;
        const r = baseBpm * m;
        if (r < MIN_BPM || r > MAX_BPM) return;
        curMult = m; startMet(r);
    }


    window.onload = initApp;
</script>
</body>
</html>
